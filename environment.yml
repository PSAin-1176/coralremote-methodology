# CoralRemote Python port. Versions pinned to the environment the parity
# results were produced with (16 Nov 2026).
name: coralremote
channels:
  - conda-forge
dependencies:
  - python=3.13.9
  - numpy=2.4.4
  - scipy=1.16.3
  - h5py=3.15.1
  - rasterio=1.5.0
  - scikit-image=0.25.2
  - scikit-learn=1.7.2
  - matplotlib=3.10.6
  - pytest=8.4.2
  - pip
  # Pending author approval (patch plan §7.5): mat-io (reads MATLAB
  # TreeBagger objects), arosics, pyproj, geopandas/shapely.
