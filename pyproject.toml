[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "coralremote"
version = "1.0.0"
description = "PlanetScope coral bleaching pipeline (Python port of the CoralRemote MATLAB methodology)"
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "h5py", "rasterio", "scikit-image", "scikit-learn", "mat-io"]
license = {file = "LICENSE"}
readme = "README.md"

[tool.setuptools]
packages = ["coralremote"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["data: needs the frozen paper-of-record data under CORALREMOTE_ROOT", "slow: takes over a minute (Py4 training)"]
